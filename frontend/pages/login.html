<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - FASTFOOD</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
  
    <!-- Google Fonts: Plus Jakarta Sans & Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div id="site-header"></div>

  <main class="auth-page-wrap">
    <div class="auth-form-card">
      <div style="text-align:center; margin-bottom:1.75rem;">
        <h1 style="font-size:1.75rem; font-weight:900; color:var(--text-main); margin-bottom:0.35rem;">
          Đăng Nhập
        </h1>
        <p style="font-size:0.9rem; color:var(--text-secondary);">
          Chào mừng quay trở lại! Đặt món ăn nóng hổi ngay.
        </p>
      </div>

      <!-- Quick Demo Login Buttons -->
      <div style="background:var(--secondary-color); padding:0.75rem; border-radius:var(--radius-md); margin-bottom:1.5rem; text-align:center;">
        <small style="color:var(--primary-color); font-weight:700; display:block; margin-bottom:0.4rem;">ĐIỀN NHANH TÀI KHOẢN MẪU:</small>
        <div style="display:flex; justify-content:center; gap:0.5rem;">
          <button type="button" class="btn btn-white btn-sm" onclick="fillDemoAccount('customer')">Khách Hàng</button>
          <button type="button" class="btn btn-white btn-sm" onclick="fillDemoAccount('owner')">Chủ Quán</button>
          <button type="button" class="btn btn-white btn-sm" onclick="fillDemoAccount('admin')">Admin</button>
        </div>
      </div>

      <form id="login-page-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Địa chỉ Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="customer@fastfood.vn" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Mật khẩu</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; font-size:0.85rem;">
          <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
            <input type="checkbox" checked style="accent-color:var(--primary-color);">
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <a href="#" style="color:var(--primary-color); font-weight:600;">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
          Đăng Nhập
        </button>
      </form>

      <div style="margin-top:1.5rem; text-align:center; font-size:0.9rem; color:var(--text-secondary);">
        Chưa có tài khoản? <a href="./register.html" style="color:var(--primary-color); font-weight:700;">Đăng ký miễn phí</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
