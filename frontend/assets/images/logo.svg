<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="ff-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA24A" />
      <stop offset="100%" stop-color="#F28A24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#F28A24" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Mascot / Burger Delivery Icon -->
  <g transform="translate(8, 14)">
    <!-- Delivery Speed Trail -->
    <path d="M 0 16 L 8 16" stroke="#F28A24" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 3 24 L 11 24" stroke="#F28A24" stroke-width="3" stroke-linecap="round" />
    <path d="M 0 32 L 6 32" stroke="#FFAA00" stroke-width="2.5" stroke-linecap="round" />

    <!-- Top Bun -->
    <path d="M 16 22 C 16 10, 48 10, 48 22 Z" fill="#F28A24" filter="url(#shadow)" />
    <!-- Sesame Seeds -->
    <circle cx="26" cy="16" r="1.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="34" cy="14" r="1.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="40" cy="17" r="1.5" fill="#FFFFFF" opacity="0.9" />

    <!-- Cheese slice -->
    <path d="M 15 24 L 50 24 L 43 28 L 22 28 Z" fill="#FFAA00" />
    
    <!-- Patty -->
    <rect x="14" y="28" width="36" height="6" rx="3" fill="#8B4513" />

    <!-- Fresh Lettuce wave -->
    <path d="M 12 36 Q 21 32 30 36 Q 39 32 48 36 Q 52 38 50 40 L 14 40 Z" fill="#10B981" />

    <!-- Bottom Bun -->
    <rect x="16" y="42" width="32" height="6" rx="3" fill="#F28A24" />
  </g>

  <!-- Typography -->
  <text x="74" y="49" font-family="'Inter', 'Be Vietnam Pro', sans-serif" font-size="34" font-weight="900" fill="#222222" letter-spacing="-1">
    FAST<tspan fill="#F28A24">FOOD</tspan>
  </text>
  
  <!-- Express Tag Badge -->
  <rect x="238" y="27" width="68" height="22" rx="6" fill="url(#ff-orange)" />
  <text x="272" y="42" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.75">EXPRESS</text>
</svg>

