<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="500" height="420">
  <defs>
    <linearGradient id="glowCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E5" />
      <stop offset="100%" stop-color="#FFE0B8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#F28A24" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Decorative Shape -->
  <circle cx="250" cy="210" r="180" fill="url(#glowCircle)" />
  <circle cx="390" cy="110" r="24" fill="#F28A24" opacity="0.15" />
  <circle cx="90" cy="300" r="18" fill="#F28A24" opacity="0.12" />

  <!-- Delivery Bag / Cloche Illustration -->
  <g transform="translate(100, 70)" filter="url(#softGlow)">
    <!-- Base Plate -->
    <ellipse cx="150" cy="240" rx="140" ry="24" fill="#E2E8F0" />
    <ellipse cx="150" cy="235" rx="130" ry="18" fill="#FFFFFF" />

    <!-- Big Juicy Burger -->
    <!-- Bottom Bun -->
    <path d="M 60 215 Q 150 230 240 215 L 235 195 Q 150 205 65 195 Z" fill="#E58420" />
    <!-- Patty -->
    <rect x="55" y="178" width="190" height="20" rx="10" fill="#6A2E12" />
    <!-- Melted Cheese -->
    <path d="M 50 178 L 250 178 L 225 192 L 180 180 L 140 196 L 100 180 L 70 192 Z" fill="#FFAA00" />
    <!-- Tomato slices -->
    <ellipse cx="105" cy="165" rx="45" ry="12" fill="#EF4444" />
    <ellipse cx="195" cy="165" rx="45" ry="12" fill="#EF4444" />
    <!-- Crispy Lettuce Wave -->
    <path d="M 45 155 Q 70 142 95 156 Q 120 142 150 156 Q 180 142 205 156 Q 230 142 255 155 L 250 168 Q 150 178 50 168 Z" fill="#10B981" />
    <!-- Top Big Bun -->
    <path d="M 55 150 C 55 60, 245 60, 245 150 Z" fill="#F28A24" />
    <!-- White Sesame Seeds -->
    <ellipse cx="110" cy="100" rx="4" ry="2" fill="#FFFFFF" transform="rotate(-15 110 100)" />
    <ellipse cx="140" cy="85" rx="4" ry="2" fill="#FFFFFF" transform="rotate(5 140 85)" />
    <ellipse cx="170" cy="90" rx="4" ry="2" fill="#FFFFFF" transform="rotate(-10 170 90)" />
    <ellipse cx="195" cy="110" rx="4" ry="2" fill="#FFFFFF" transform="rotate(20 195 110)" />
    <ellipse cx="150" cy="115" rx="4" ry="2" fill="#FFFFFF" transform="rotate(0 150 115)" />
  </g>

  <!-- Sparkles -->
  <path d="M 380 70 Q 380 85 395 85 Q 380 85 380 100 Q 380 85 365 85 Q 380 85 380 70 Z" fill="#FFAA00" />
  <path d="M 80 180 Q 80 192 92 192 Q 80 192 80 204 Q 80 192 68 192 Q 80 192 80 180 Z" fill="#F28A24" />
</svg>

