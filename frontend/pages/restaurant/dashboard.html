<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kênh Quán Ăn Đối Tác - FASTFOOD</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="/index.html" class="brand-logo">
        <img src="/assets/images/logo.svg" alt="FASTFOOD Logo" style="height: 40px;">
        <span class="logo-badge">Đối Tác Quán</span>
      </a>
      <a href="/index.html" class="btn btn-outline btn-sm">← Về Trang Chủ</a>
    </div>
  </header>

  <main class="container" style="padding-top: 2.5rem;">
    <div class="card" style="margin-bottom: 2rem;">
      <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;">Cổng Quản Trị Quán Ăn (Partner Portal)</h2>
      <p style="color: var(--text-secondary);">Quản lý đơn hàng đang chế biến, chỉnh sửa món ăn và báo cáo doanh thu theo ca.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem;">
      <div class="card">
        <small style="color: var(--text-muted);">Đơn Hàng Hôm Nay</small>
        <div style="font-size: 2rem; font-weight: 800; color: var(--primary-color);">0</div>
      </div>
      <div class="card">
        <small style="color: var(--text-muted);">Doanh Thu Dự Kiến</small>
        <div style="font-size: 2rem; font-weight: 800; color: var(--secondary-color);">0 đ</div>
      </div>
      <div class="card">
        <small style="color: var(--text-muted);">Trạng Thái Quán</small>
        <div><span class="badge badge-success"><span class="status-dot online"></span> Đang Mở Cửa</span></div>
      </div>
    </div>
  </main>
</body>
</html>
