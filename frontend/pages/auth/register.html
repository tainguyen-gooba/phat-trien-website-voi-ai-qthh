<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản - FASTFOOD</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="./auth.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="/index.html" class="brand-logo">
        <img src="/assets/images/logo.svg" alt="FASTFOOD Logo" style="height: 40px;">
      </a>
      <a href="/index.html" class="btn btn-outline btn-sm">← Về Trang Chủ</a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h1 class="auth-title">Đăng Ký Tài Khoản</h1>
      <p class="auth-subtitle">Tạo tài khoản để nhận ngập tràn voucher giảm giá món ăn.</p>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Họ và Tên</label>
          <input type="text" id="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Địa chỉ Email</label>
          <input type="email" id="email" class="form-control" placeholder="vidu@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Số Điện Thoại</label>
          <input type="tel" id="phone" class="form-control" placeholder="0901234567" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu</label>
          <input type="password" id="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem;">
          Đăng Ký Tài Khoản
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
        Đã có tài khoản? <a href="./login.html" style="color: var(--primary-color); font-weight: 600;">Đăng nhập</a>
      </div>
    </div>
  </main>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
