<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="fastfood-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B14F" />
      <stop offset="100%" stop-color="#008038" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF533D" />
      <stop offset="100%" stop-color="#E43E29" />
    </linearGradient>
  </defs>
  
  <!-- Icon Burger / Fast Delivery -->
  <g transform="translate(10, 12)">
    <!-- Bun Top -->
    <path d="M 10 24 C 10 12, 46 12, 46 24 Z" fill="#FFAA00" />
    <!-- Patty -->
    <rect x="8" y="27" width="40" height="8" rx="4" fill="#8B4513" />
    <!-- Lettuce (Fresh Green) -->
    <path d="M 6 36 Q 16 32 26 36 Q 36 32 46 36 Q 50 38 48 40 L 8 40 Z" fill="#00B14F" />
    <!-- Bun Bottom -->
    <rect x="10" y="42" width="36" height="6" rx="3" fill="#FFAA00" />
    <!-- Speed streaks -->
    <line x1="2" y1="20" x2="6" y2="20" stroke="#FF533D" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="28" x2="5" y2="28" stroke="#FF533D" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Brand Text -->
  <text x="75" y="48" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#00B14F" letter-spacing="-1">
    FAST<tspan fill="#FF533D">FOOD</tspan>
  </text>
  
  <!-- Delivery Tag -->
  <rect x="235" y="26" width="70" height="22" rx="6" fill="url(#badge-grad)" />
  <text x="270" y="41" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">EXPRESS</text>
</svg>

