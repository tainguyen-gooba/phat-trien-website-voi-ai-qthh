<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Sách Quán Ăn Đối Tác - FASTFOOD</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
  
    <!-- Google Fonts: Plus Jakarta Sans & Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="restaurants-page">

  <div id="site-header"></div>

  <!-- Page Header -->
  <div class="page-header-bar">
    <div class="container">
      <div class="breadcrumb">
        <a href="./home.html">Trang chủ</a> <span>/</span> <span>Nhà hàng đối tác</span>
      </div>
      <h1 class="page-title">Khám Phá Các Quán Ăn Ngon</h1>
      <p class="restaurants-page-intro">Tìm quán yêu thích và khám phá những món ngon gần bạn.</p>
    </div>
  </div>

  <main class="container">
    <div class="layout-with-sidebar">
      
      <!-- Filter Sidebar -->
      <aside class="filter-sidebar" aria-labelledby="restaurant-filter-title">
        <h2 class="restaurant-filter-heading" id="restaurant-filter-title">Danh mục quán</h2>

        <!-- Nhóm danh mục -->
        <div class="filter-group">
          <label class="filter-checkbox-item">
            <input type="radio" name="res-cat" class="filter-category-radio" value="all" checked>
            <span>Tất cả quán ăn</span>
          </label>
          <label class="filter-checkbox-item">
            <input type="radio" name="res-cat" class="filter-category-radio" value="burger">
            <span>Burger & Gà Rán</span>
          </label>
          <label class="filter-checkbox-item">
            <input type="radio" name="res-cat" class="filter-category-radio" value="com">
            <span>Cơm & Món Việt</span>
          </label>
          <label class="filter-checkbox-item">
            <input type="radio" name="res-cat" class="filter-category-radio" value="tra-sua">
            <span>Trà Sữa & Đồ Uống</span>
          </label>
          <label class="filter-checkbox-item">
            <input type="radio" name="res-cat" class="filter-category-radio" value="pizza">
            <span>Pizza & Mỳ Ý</span>
          </label>
        </div>

      </aside>

      <!-- Main Content Area -->
      <section class="restaurants-content" aria-label="Danh sách quán ăn">
        <div class="content-top-toolbar">
          <label class="restaurant-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
            <input type="search" id="restaurant-search-input" class="form-control" placeholder="Tìm theo tên quán hoặc món ăn..." aria-label="Tìm theo tên quán hoặc món ăn">
          </label>

          <label class="restaurant-sort">
            <span>Sắp xếp</span>
            <select id="restaurant-sort-select" class="form-control">
              <option value="popular">Phổ biến nhất</option>
              <option value="rating">Đánh giá cao nhất</option>
              <option value="reviews">Nhiều đánh giá nhất</option>
            </select>
          </label>
        </div>

        <!-- Restaurants Grid -->
        <div class="restaurant-results" id="restaurant-results-count" aria-live="polite"></div>
        <div class="restaurants-grid" id="restaurants-grid-container">
          <!-- Rendered by restaurants.js -->
        </div>
      </section>

    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/restaurants.js"></script>
</body>
</html>
